<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URI Encoding Example</title>
</head>
<body>
  <p>Incorrect (unencoded):  
    <a href="https://example.com/search?query=HTML & CSS">HTML & CSS Search</a>
  </p>

  <p>Correct (encoded):  
    <a href="https://example.com/search?query=HTML%20%26%20CSS">HTML &amp; CSS Search (Encoded)</a>
  </p>
</body>
</html>
