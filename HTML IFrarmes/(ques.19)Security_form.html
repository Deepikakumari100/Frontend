<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Form Example</title>
</head>
<body>
  <form autocomplete="off">
    <label>Username: <input type="text" required></label><br>
    <label>Password: <input type="password" required></label><br>
    <input type="submit" value="Login">
  </form>

  <p>Note: Turning off autocomplete prevents browsers from saving sensitive data, improving security.</p>
</body>
</html>
